[package]
name = "Supa-Admin"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "supa"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
arboard = "3.6.1"
chrono = "0.4.44"
crossterm = "0.29.0"
directories = "6.0.0"
ratatui = "0.30.0"
reqwest = { version = "0.13.3", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.2", features = ["full"] }
